subject: updateUtil
module: ./update-util.js
subjectType: function
methods:
  normalizeVersion:
    terms:
      # Release tags carry a leading 'v' which the display version drops.
      - params:
          - version: v0.2.0
        result: 0.2.0
      # app.getVersion() already comes without the prefix and stays untouched.
      - params:
          - version: 0.2.0
        result: 0.2.0
  isNewerVersion:
    terms:
      # A tag string is accepted next to a plain version string.
      - params:
          - candidate: v0.2.0
            current: 0.1.2
        result: true
      # Patch bumps count as newer.
      - params:
          - candidate: 0.1.3
            current: 0.1.2
        result: true
      # Minor jumps beat any patch difference.
      - params:
          - candidate: 0.2.0
            current: 0.1.9
        result: true
      # Major jumps beat any minor difference.
      - params:
          - candidate: 1.0.0
            current: 0.9.9
        result: true
      # Missing segments count as zero, so 0.1 equals 0.1.0.
      - params:
          - candidate: 0.1.1
            current: '0.1'
        result: true
      # Equal versions are not newer.
      - params:
          - candidate: 0.1.2
            current: 0.1.2
        result: false
      # Older candidates are not newer.
      - params:
          - candidate: 0.1.2
            current: 0.2.0
        result: false
      # Missing segments count as zero on the candidate too.
      - params:
          - candidate: '0.1'
            current: 0.1.0
        result: false
  selectUpdateAsset:
    terms:
      # A dmg install (darwin) picks the universal dmg from a mixed asset list.
      - params:
          - assets:
              - name: Tmux-Companion-0.2.0-universal.dmg
                size: 100
                url: https://example.com/Tmux-Companion-0.2.0-universal.dmg
              - name: Tmux-Companion-0.2.0.AppImage
                size: 90
                url: https://example.com/Tmux-Companion-0.2.0.AppImage
              - name: tmux-companion_0.2.0_amd64.deb
                size: 80
                url: https://example.com/tmux-companion_0.2.0_amd64.deb
            installType: dmg
        result:
          name: Tmux-Companion-0.2.0-universal.dmg
          size: 100
          url: https://example.com/Tmux-Companion-0.2.0-universal.dmg
      # A deb install picks the deb even when an AppImage is published.
      - params:
          - assets:
              - name: Tmux-Companion-0.2.0-universal.dmg
                size: 100
                url: https://example.com/Tmux-Companion-0.2.0-universal.dmg
              - name: Tmux-Companion-0.2.0.AppImage
                size: 90
                url: https://example.com/Tmux-Companion-0.2.0.AppImage
              - name: tmux-companion_0.2.0_amd64.deb
                size: 80
                url: https://example.com/tmux-companion_0.2.0_amd64.deb
            installType: deb
        result:
          name: tmux-companion_0.2.0_amd64.deb
          size: 80
          url: https://example.com/tmux-companion_0.2.0_amd64.deb
      # An AppImage install picks the AppImage from the same mixed list.
      - params:
          - assets:
              - name: Tmux-Companion-0.2.0-universal.dmg
                size: 100
                url: https://example.com/Tmux-Companion-0.2.0-universal.dmg
              - name: Tmux-Companion-0.2.0.AppImage
                size: 90
                url: https://example.com/Tmux-Companion-0.2.0.AppImage
              - name: tmux-companion_0.2.0_amd64.deb
                size: 80
                url: https://example.com/tmux-companion_0.2.0_amd64.deb
            installType: appImage
        result:
          name: Tmux-Companion-0.2.0.AppImage
          size: 90
          url: https://example.com/Tmux-Companion-0.2.0.AppImage
      # A deb install gets nothing when only an AppImage is published.
      - params:
          - assets:
              - name: Tmux-Companion-0.2.0.AppImage
                size: 90
                url: https://example.com/Tmux-Companion-0.2.0.AppImage
            installType: deb
        result: null
      # Dev builds prefer the AppImage and fall back to the deb.
      - params:
          - assets:
              - name: tmux-companion_0.2.0_amd64.deb
                size: 80
                url: https://example.com/tmux-companion_0.2.0_amd64.deb
              - name: Tmux-Companion-0.2.0.AppImage
                size: 90
                url: https://example.com/Tmux-Companion-0.2.0.AppImage
            installType: dev
        result:
          name: Tmux-Companion-0.2.0.AppImage
          size: 90
          url: https://example.com/Tmux-Companion-0.2.0.AppImage
      - params:
          - assets:
              - name: tmux-companion_0.2.0_amd64.deb
                size: 80
                url: https://example.com/tmux-companion_0.2.0_amd64.deb
            installType: dev
        result:
          name: tmux-companion_0.2.0_amd64.deb
          size: 80
          url: https://example.com/tmux-companion_0.2.0_amd64.deb
      # Install types without a published asset get nothing.
      - params:
          - assets:
              - name: Tmux-Companion-0.2.0-universal.dmg
                size: 100
                url: https://example.com/Tmux-Companion-0.2.0-universal.dmg
            installType: unsupported
        result: null
      # An empty asset list gets nothing for any install type.
      - params:
          - assets: []
            installType: deb
        result: null
  toDebInstallOutcome:
    terms:
      # A zero exit code means dpkg installed the package.
      - params:
          - exitCode: 0
            isSpawnFailed: false
        result: installed
      # Dismissing the polkit dialog is a deliberate cancel, not a failure.
      - params:
          - exitCode: 126
            isSpawnFailed: false
        result: fallback
      # pkexec refusing authorization also falls back to the manual flow.
      - params:
          - exitCode: 127
            isSpawnFailed: false
        result: fallback
      # A missing pkexec binary falls back to the manual flow.
      - params:
          - exitCode: null
            isSpawnFailed: true
        result: fallback
      # Any other dpkg failure is a real error.
      - params:
          - exitCode: 2
            isSpawnFailed: false
        result: failed
      # A process killed by a signal is a real error.
      - params:
          - exitCode: null
            isSpawnFailed: false
        result: failed
  toDownloadButtonLabel:
    terms:
      # Before anything starts the link names the version it would fetch.
      - params:
          - downloadPercent: null
            latestVersion: 0.2.0
            updateFlowState: idle
        result: Download v0.2.0
      # Downloading without a known size shows no percentage.
      - params:
          - downloadPercent: null
            latestVersion: 0.2.0
            updateFlowState: downloading
        result: Downloading…
      # Downloading with a known size shows the percentage.
      - params:
          - downloadPercent: 42
            latestVersion: 0.2.0
            updateFlowState: downloading
        result: Downloading… 42%
      # Installing covers the pkexec dialog and the dpkg run.
      - params:
          - downloadPercent: null
            latestVersion: 0.2.0
            updateFlowState: installing
        result: Installing…
      # After a successful install the button offers the restart.
      - params:
          - downloadPercent: 100
            latestVersion: 0.2.0
            updateFlowState: restart-required
        result: Restart to finish update
      # After a plain download the installer has already been opened.
      - params:
          - downloadPercent: 100
            latestVersion: 0.2.0
            updateFlowState: downloaded
        result: Opened installer
  toInstallType:
    terms:
      # darwin always maps to dmg, packaged or not.
      - params:
          - appImagePath: null
            isPackaged: true
            platform: darwin
        result: dmg
      - params:
          - appImagePath: null
            isPackaged: false
            platform: darwin
        result: dmg
      # An unpackaged linux build keeps the manual dev flow.
      - params:
          - appImagePath: null
            isPackaged: false
            platform: linux
        result: dev
      # A packaged linux app with APPIMAGE set is an AppImage install.
      - params:
          - appImagePath: /home/demo/apps/Tmux-Companion.AppImage
            isPackaged: true
            platform: linux
        result: appImage
      # A packaged linux app without APPIMAGE is a deb install.
      - params:
          - appImagePath: null
            isPackaged: true
            platform: linux
        result: deb
      # Any other platform has no self-update flow.
      - params:
          - appImagePath: null
            isPackaged: true
            platform: win32
        result: unsupported
  toUpdateButtonTitle:
    terms:
      # Once the update is installed the tooltip invites the restart.
      - params:
          - currentVersion: 0.1.2
            downloadedFilePath: /home/demo/Downloads/tmux-companion_0.2.0_amd64.deb
            latestVersion: 0.2.0
            updateFlowState: restart-required
        result: Update installed — restart to finish
      # While installing the tooltip says so.
      - params:
          - currentVersion: 0.1.2
            downloadedFilePath: null
            latestVersion: 0.2.0
            updateFlowState: installing
        result: Installing the downloaded update…
      # Once downloaded the tooltip points at the saved installer.
      - params:
          - currentVersion: 0.1.2
            downloadedFilePath: /Users/demo/Downloads/Tmux-Companion-0.2.0-universal.dmg
            latestVersion: 0.2.0
        result: Installer saved to /Users/demo/Downloads/Tmux-Companion-0.2.0-universal.dmg
      # Before that the tooltip shows the version transition.
      - params:
          - currentVersion: 0.1.2
            downloadedFilePath: null
            latestVersion: 0.2.0
        result: Version 0.2.0 available (current 0.1.2)
  toUpdateFlowState:
    terms:
      # A completed download without self-install is the manual opened state.
      - params:
          - status: completed
        result: downloaded
      - params:
          - status: downloading
        result: downloading
      # A failed download or install resets the button.
      - params:
          - status: error
        result: idle
      - params:
          - status: idle
        result: idle
      - params:
          - status: installing
        result: installing
      - params:
          - status: restart-required
        result: restart-required
