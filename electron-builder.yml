appId: com.tmux-companion.app
productName: Tmux Companion
protocols:
  - name: Tmux Companion
    schemes:
      - tmux-companion
directories:
  output: dist
files:
  - out/**
  - build/icons/512x512.png
  # node-pty is rebuilt per-arch into build/Release by electron-builder; its runtime
  # loader never reads bin/ (install-time cache) or prebuilds/ (Node-ABI prebuilds,
  # only consulted when build/Release is missing). Both ship byte-identical into the
  # x64 and arm64 per-arch builds, which @electron/universal rejects (identical
  # Mach-O across arch builds) — so they are excluded from packaging entirely.
  - '!**/node-pty/bin/**'
  - '!**/node-pty/prebuilds/**'
asar: true
mac:
  category: public.app-category.developer-tools
  identity: null
  # macOS Local Network privacy attributes every process in the app's tmux server
  # (ssh, ping, shells) to this app; without this key LAN traffic can fail with
  # "No route to host". Ad-hoc signing means each release is a new identity, so
  # users may need to re-allow it in Privacy & Security > Local Network after updates.
  extendInfo:
    NSLocalNetworkUsageDescription: Tmux Companion needs local network access so SSH and other commands run in its terminals can reach hosts on your network.
  artifactName: Tmux-Companion-${version}-${arch}.dmg
  target:
    - target: dmg
      arch:
        - universal
linux:
  category: Utility
  maintainer: milos
  executableName: tmux-companion
  syncDesktopName: true
  target:
    - AppImage
    - deb
appImage:
  artifactName: Tmux-Companion-${version}.${ext}
deb:
  artifactName: tmux-companion_${version}_${arch}.deb
